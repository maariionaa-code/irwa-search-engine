{% extends "base.html" %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="mx-auto my-5" style="max-width: 40rem;">
    <h1 class="text-center mb-4">Find fashion products</h1>
    {% if error %}
        <p class="alert alert-warning" role="alert">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('search') }}" method="get">
        <label for="query">Search the catalogue</label>
        <div class="input-group">
            <input class="form-control" id="query" name="q" type="search"
                   placeholder="e.g. women cotton kurta" required autofocus>
            <div class="input-group-append">
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
